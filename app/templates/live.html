{% extends "base.html" %}
{% block title %}Live Counter{% endblock %}

{% block extra_head %}
<style>
  /* ── fullscreen play mode ─────────────────────── */
  body.live-play nav,
  body.live-play footer,
  body.live-play > main > *:not(#live-play) { display: none !important; }
  body.live-play main { padding: 0 !important; max-width: none !important; }

  /* ── play screen ──────────────────────────────── */
  #live-play { display: block; position: fixed; inset: 0; background: #111; overflow: hidden; touch-action: none; }
  #play-grid { position: absolute; inset: 4px; display: grid; gap: 4px; }

  /* ── tile ─────────────────────────────────────── */
  .tile { position: relative; overflow: hidden; background: #0a0a0a; cursor: pointer; user-select: none; border-radius: 8px; }
  .tile.eliminated { opacity: 0.35; }
  .tile.sorteggio-highlight { background: #3b0764; }
  .tile-inner { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  /* tile-content is the rotated wrapper; children fill it */
  .tile-content { position: relative; width: 100%; height: 100%; }

  /* play content */
  .tile-play-content {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; height: 100%;
  }

  /* edit content — full-tile centering wrapper */
  .tile-edit-content {
    display: none; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; height: 100%;
    touch-action: auto; pointer-events: auto;
  }

  /* toggle */
  .tile.tile-editing .tile-play-content { display: none; }
  .tile.tile-editing .tile-edit-content { display: flex; }

  /* dark card inside the tile */
  .tile-edit-card {
    display: flex; flex-direction: column; gap: 0.5rem;
    background: #1a1d27; border: 1px solid #2d3147; border-radius: 0.75rem;
    box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    padding: 0.9rem; width: min(88%, 21rem);
    touch-action: auto; pointer-events: auto;
  }

  /* color swatches */
  .tile-swatches {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 0.35rem;
    margin-top: 0.35rem; margin-bottom: 0.35rem;
  }
  .color-swatch {
    width: 1.2rem; height: 1.2rem; border-radius: 50%;
    cursor: pointer; border: 2px solid transparent; padding: 0;
  }
  .color-swatch.selected { border-color: #f1f5f9; }

  /* selects — dark app style */
  .tile-sel {
    width: 100%; font-size: 0.75rem;
    background: #0f1117; color: #f1f5f9;
    border: 1px solid #334155; border-radius: 0.4rem; padding: 0.35rem 0.5rem;
    touch-action: auto; pointer-events: auto; user-select: auto;
  }

  /* OK button — violet like start button */
  .tile-ok-btn {
    width: 100%; padding: 0.4rem;
    background: #7c3aed; color: #fff;
    border: none; border-radius: 0.5rem;
    font-size: 0.8rem; font-weight: 700; cursor: pointer;
  }
  .tile-ok-btn:hover:not(:disabled) { background: #6d28d9; }
  .tile-ok-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .tile-hp {
    font-size: clamp(2.5rem, 10vw, 5.5rem);
    font-weight: 900;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    transition: color 0.2s;
  }
  .tile.eliminated .tile-hp { opacity: 0.4; }
  .tile-name { font-size: clamp(0.7rem, 2.5vw, 1.1rem); margin-top: 0.35rem; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; opacity: 0.7; }
  .tile-corner { position: absolute; z-index: 10; }
  .tile.tile-editing .tile-corner { display: none; }
  .corner-tl { top: 0.5rem; left: 0.5rem; }
  .corner-tr { top: 0.5rem; right: 0.5rem; }
  .corner-bl { bottom: 0.5rem; left: 0.5rem; }
  .corner-br { bottom: 0.5rem; right: 0.5rem; }
  .edit-btn {
    width: clamp(1.8rem, 5vw, 2.2rem); height: clamp(1.8rem, 5vw, 2.2rem);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.5); border: 1.5px solid rgba(255,255,255,0.3);
    font-size: clamp(0.8rem, 2.5vw, 1.05rem); cursor: pointer;
    backdrop-filter: blur(4px);
  }
  .edit-btn:hover { background: rgba(0,0,0,0.75); border-color: rgba(255,255,255,0.6); }
  .tile-sol-row {
    display: flex; align-items: center; gap: 0.5rem;
    color: #94a3b8; font-size: 0.75rem; cursor: pointer;
    padding-top: 0.1rem;
  }
  .tile-sol-row input[type="checkbox"] {
    cursor: pointer; accent-color: #7c3aed; width: 0.9rem; height: 0.9rem;
    touch-action: auto; pointer-events: auto;
  }
  .tile-elim-overlay {
    display: none; position: absolute; inset: 0;
    align-items: center; justify-content: center;
    font-size: clamp(1.5rem, 6vw, 3rem); color: #475569;
    background: rgba(0,0,0,0.3);
  }
  .tile.eliminated .tile-elim-overlay { display: flex; }
  @keyframes hp-flash { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .hp-flash { animation: hp-flash 0.18s ease; }

  /* ── turn center ──────────────────────────────── */
  #turn-center {
    display: none;
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 50; align-items: center; gap: 0.4rem;
    background: rgba(0,0,0,0.75); border-radius: 1rem;
    padding: 0.5rem 0.75rem; backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.08);
  }
  #turn-row { position: relative; display: flex; align-items: center; gap: 0.5rem; }
  #home-btn {
    white-space: nowrap; background: #1e3a5f; color: #93c5fd;
    border: none; padding: 0.4rem 1rem; border-radius: 0.5rem;
    font-size: 0.78rem; cursor: pointer; font-weight: 600;
  }
  #home-btn:hover { background: #1e40af; }

  /* ── setup center ─────────────────────────────── */
  #setup-center {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 50; display: flex; flex-direction: column; align-items: center; gap: 0.75rem;
    background: rgba(0,0,0,0.85); border-radius: 1rem;
    padding: 1rem 1.5rem; backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.1); min-width: 13rem; text-align: center;
  }
  #setup-center.hidden { display: none; }
  #setup-start-btn {
    width: 100%; padding: 0.5rem 1rem; background: #7c3aed; color: #fff;
    border: none; border-radius: 0.5rem; font-size: 0.9rem; font-weight: 700;
    cursor: pointer;
  }
  #setup-start-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  #setup-start-btn:not(:disabled):hover { background: #6d28d9; }
  #setup-back-btn {
    background: transparent; border: 1px solid rgba(255,255,255,0.2);
    color: #94a3b8; font-size: 0.9rem; cursor: pointer;
    padding: 0.4rem 0.65rem; border-radius: 0.4rem; line-height: 1; flex-shrink: 0;
  }
  #setup-back-btn:hover { color: #e2e8f0; border-color: rgba(255,255,255,0.4); }
  .turn-btn {
    background: transparent; border: none; color: #94a3b8;
    font-size: 1.3rem; cursor: pointer; padding: 0 0.2rem; line-height: 1;
  }
  .turn-btn:hover { color: #e2e8f0; }
  #turn-num {
    font-size: 1.6rem; font-weight: 900; min-width: 2.5rem;
    text-align: center; color: #f1f5f9; cursor: pointer;
    border-radius: 0.4rem; padding: 0 0.2rem;
  }
  #turn-num[contenteditable="true"] { background: #1e293b; outline: none; }
  #long-press-actions {
    display: none; position: absolute; top: calc(100% + 0.5rem);
    left: 50%; transform: translateX(-50%);
    flex-direction: row; gap: 0.5rem; align-items: center;
  }
  #long-press-actions.visible { display: flex; }
  #end-game-btn {
    white-space: nowrap; background: #7f1d1d; color: #fca5a5;
    border: none; padding: 0.4rem 1rem; border-radius: 0.5rem;
    font-size: 0.78rem; cursor: pointer; font-weight: 600;
  }
  #end-game-btn:hover { background: #991b1b; }

  /* ── auto-end overlay ─────────────────────────── */
  #end-overlay {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.88); align-items: center;
    justify-content: center; flex-direction: column; gap: 1.25rem;
    text-align: center; padding: 2rem;
  }
  #end-overlay.open { display: flex; }
  #end-overlay-msg { font-size: 1.1rem; color: #e2e8f0; font-weight: 600; }

  /* ── hp input overlay ─────────────────────────── */
  #hp-input-overlay {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.88); align-items: center; justify-content: center;
  }
  #hp-input-overlay.open { display: flex; }
  #hp-input-inner {
    background: #1a1d27; border: 1px solid #2d3147; border-radius: 1rem;
    padding: 1.5rem; width: min(90vw, 16rem); display: flex; flex-direction: column; gap: 1rem; align-items: center;
  }
  #hp-input-field { font-size: 2rem; text-align: center; width: 100%; }
</style>
{% endblock %}

{% block content %}

<!-- ══ PLAY SCREEN ═══════════════════════════════════════════ -->
<div id="live-play">
  <!-- Setup center (visible during setup phase) -->
  <div id="setup-center">
    <!-- Resume banner (shown instead of controls when a saved game exists) -->
    <div id="resume-banner" style="display:none">
      <p style="color:#fbbf24;font-size:0.85rem;margin-bottom:0.5rem">⚠ C'è una partita in corso non terminata.</p>
      <div style="display:flex;gap:0.5rem;justify-content:center">
        <button id="resume-btn" class="btn-primary text-sm" style="padding:0.3rem 0.8rem">Riprendi</button>
        <button id="discard-btn" class="btn-sm text-sm" style="padding:0.3rem 0.8rem">Scarta</button>
      </div>
    </div>
    <!-- Player count + start controls -->
    <div id="setup-controls">
      <div style="font-size:0.75rem;color:#94a3b8;margin-bottom:0.4rem">Numero di giocatori</div>
      <div style="display:flex;gap:0.4rem;margin-bottom:0.75rem">
        {% for n in [2,3,4,5,6] %}
        <button type="button"
                class="count-btn btn-sm px-3 py-1.5 font-bold {% if n == 4 %}ring-2 ring-mtg-accent{% endif %}"
                data-count="{{ n }}">{{ n }}</button>
        {% endfor %}
      </div>
      <div style="display:flex;align-items:center;gap:0.5rem;width:100%">
        <button id="setup-back-btn">←</button>
        <button id="setup-start-btn" disabled style="flex:1">Inizia Partita</button>
      </div>
    </div>
  </div>

  <div id="play-grid"></div>

  <!-- Turn center -->
  <div id="turn-center">
    <div id="turn-row">
      <button class="turn-btn" id="turn-minus">−</button>
      <span id="turn-num" title="Premi a lungo per terminare">1</span>
      <button class="turn-btn" id="turn-plus">+</button>
      <div id="long-press-actions">
        <button id="home-btn">⌂ Home</button>
        <button id="end-game-btn">Termina partita</button>
      </div>
    </div>
  </div>

  <!-- Auto-end overlay -->
  <div id="end-overlay">
    <p id="end-overlay-msg"></p>
    <div class="flex gap-3">
      <button id="end-overlay-confirm" class="btn-primary px-6 py-2">Conferma</button>
      <button id="end-overlay-ignore" class="btn-sm px-6 py-2">Ignora</button>
    </div>
  </div>

  <!-- HP free-input overlay -->
  <div id="hp-input-overlay">
    <div id="hp-input-inner">
      <label class="text-slate-300">Punti vita</label>
      <input id="hp-input-field" type="number" class="text-center" min="-999" max="999">
      <div class="flex gap-2 w-full">
        <button id="hp-input-confirm" class="btn-primary flex-1">OK</button>
        <button id="hp-input-cancel" class="btn-sm flex-1">Annulla</button>
      </div>
    </div>
  </div>
</div>

<script>
const PLAYERS    = {{ players_json | tojson }};
const COMMANDERS = {{ commanders_json | tojson }};
const STATE_KEY  = 'mtg_live_game';
window._liveInteractionsBound = false;

const TILE_COLORS = [
  '#0dcaf0',  // Cyan
  '#ffc107',  // Ambra
  '#fd7e14',  // Arancio
  '#51cf66',  // Verde
  '#f783ac',  // Rosa
  '#e599f7',  // Lavanda
  '#74c0fc',  // Azzurro
  '#a9e34b',  // Lime
];

function textColor() { return '#000000'; }

function assignColors(count) {
  const shuffled = [...TILE_COLORS].sort(() => Math.random() - 0.5);
  return Array.from({ length: count }, (_, i) => shuffled[i % shuffled.length]);
}

function makeSetupState(playerCount) {
  const colors = assignColors(6);
  const slots = Array.from({ length: 6 }, (_, i) => ({
    playerId: null, playerName: '',
    commanderId: null, commanderName: '',
    hp: 40, solRing: false, eliminated: false, turnEliminated: null,
    color: colors[i], confirmed: false,
  }));
  return {
    phase: 'setup', playerCount,
    slots, currentTurn: 1, firstPlayerIndex: null,
    startedAt: new Date().toISOString().slice(0, 10),
  };
}

function makePlayState(state) {
  return { ...state, phase: 'play' };
}

function updateStartBtn(state) {
  const allConfirmed = state.slots.slice(0, state.playerCount).every(s => s.confirmed);
  const btn = document.getElementById('setup-start-btn');
  if (!btn) return;
  btn.disabled = !allConfirmed;
}

function handleTileOk(state, slotIdx) {
  const tile = document.querySelector(`.tile[data-slot="${slotIdx}"]`);
  if (!tile) return;
  const pId = parseInt(tile.querySelector('.tile-player-sel').value);
  const cId = parseInt(tile.querySelector('.tile-commander-sel').value);
  if (!pId || !cId) return;
  const player    = PLAYERS.find(p => p.id === pId);
  const commander = COMMANDERS.find(c => c.id === cId);
  const slot = state.slots[slotIdx];
  slot.playerId      = pId;
  slot.playerName    = player?.name ?? '';
  slot.commanderId   = cId;
  slot.commanderName = commander?.name ?? '';
  slot.solRing       = tile.querySelector('.tile-sol-check').checked;
  slot.confirmed     = true;
  tile.querySelector('.tile-hp').textContent   = slot.hp;
  tile.querySelector('.tile-name').textContent = slot.playerName;
  tile.classList.remove('tile-editing');
  saveState(state);
  if (state.phase === 'setup') updateStartBtn(state);
}

function setTileEditMode(state, slotIdx) {
  const tile = document.querySelector(`.tile[data-slot="${slotIdx}"]`);
  if (!tile) return;
  const slot = state.slots[slotIdx];
  tile.querySelector('.tile-player-sel').value    = slot.playerId   ?? '';
  tile.querySelector('.tile-commander-sel').value = slot.commanderId ?? '';
  tile.querySelector('.tile-sol-check').checked   = slot.solRing ?? false;
  tile.querySelectorAll('.color-swatch').forEach(s => {
    s.classList.toggle('selected', s.dataset.color === slot.color);
  });
  tile.classList.add('tile-editing');
}

const countBtns = Array.from(document.querySelectorAll('.count-btn'));
function updateCountBtns(n) {
  countBtns.forEach(btn => {
    const match = parseInt(btn.dataset.count) === n;
    btn.classList.toggle('ring-2', match);
    btn.classList.toggle('ring-mtg-accent', match);
  });
}

function initSetupPhase(count) {
  const state = makeSetupState(count);
  window._liveState = state;
  saveState(state);
  buildGrid(state);
  updateStartBtn(state);
  updateCountBtns(count);
  bindGridInteractions(state);
}

function changePlayerCount(state, newCount) {
  const oldCount = state.playerCount;
  state.playerCount = newCount;
  if (newCount > oldCount) {
    const freshColors = assignColors(6);
    for (let i = oldCount; i < newCount; i++) {
      if (!state.slots[i].confirmed) {
        state.slots[i].color = freshColors[i];
      }
    }
  }
  saveState(state);
  buildGrid(state);
  updateStartBtn(state);
  updateCountBtns(newCount);
}

// ── State helpers ──────────────────────────────────────────────
function getState() {
  try { return JSON.parse(localStorage.getItem(STATE_KEY)); } catch { return null; }
}
function saveState(s) { localStorage.setItem(STATE_KEY, JSON.stringify(s)); }
function clearState() { localStorage.removeItem(STATE_KEY); }

// ── Setup screen ───────────────────────────────────────────────
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function playerOptions(selId) {
  return '<option value="">— Giocatore —</option>' +
    PLAYERS.map(p => `<option value="${p.id}" ${p.id==selId?'selected':''}>${esc(p.name)}</option>`).join('');
}

function commanderOptions(selId) {
  return '<option value="">— Commander —</option>' +
    COMMANDERS.map(c => `<option value="${c.id}" ${c.id==selId?'selected':''}>${esc(c.name)} (${esc(c.color_identity)})</option>`).join('');
}

// ── Grid layout config ─────────────────────────────────────────
const LAYOUT_CONFIG = {
  2: { rows: '1fr 1fr', cols: '1fr',
       slots: [[2,1,1,1,0], [1,1,1,1,180]] },
  3: { rows: '1fr 1fr', cols: '1fr 1fr',
       slots: [[2,1,1,1,0], [1,1,1,1,180], [1,2,2,1,270]] },
  4: { rows: '1fr 1fr', cols: '1fr 1fr',
       slots: [[2,1,1,1,0], [2,2,1,1,0], [1,1,1,1,180], [1,2,1,1,180]] },
  5: { rows: '1fr 1fr', cols: '1fr 1fr 1fr',
       slots: [[2,1,1,1,0], [2,2,1,1,0], [1,1,1,1,180], [1,2,1,1,180], [1,3,2,1,270]] },
  6: { rows: '1fr 1fr', cols: '1fr 1fr 1fr 1fr',
       slots: [[1,1,2,1,90], [2,2,1,1,0], [2,3,1,1,0], [1,2,1,1,180], [1,3,1,1,180], [1,4,2,1,270]] },
};

document.querySelectorAll('.count-btn').forEach(btn => {
  btn.addEventListener('click', () => changePlayerCount(window._liveState, parseInt(btn.dataset.count)));
});

document.getElementById('setup-start-btn')?.addEventListener('click', () => {
  const state = window._liveState;
  if (!state || state.phase !== 'setup') return;
  enterPlay(state, true);
});

// ── Page load ──────────────────────────────────────────────────
document.body.classList.add('live-play');

document.getElementById('resume-btn').addEventListener('click', () => {
  const saved = getState();
  if (saved) enterPlay(saved);
});

document.getElementById('discard-btn').addEventListener('click', () => {
  clearState();
  document.getElementById('resume-banner').style.display = 'none';
  document.getElementById('setup-controls').style.display = '';
  initSetupPhase(4);
});

// Check for saved play-phase game
const saved = getState();
if (saved && saved.phase === 'play') {
  window._liveState = saved;
  document.getElementById('resume-banner').style.display = 'block';
  document.getElementById('setup-controls').style.display = 'none';
} else {
  initSetupPhase(4);
}

// ── Corner position helper ─────────────────────────────────────
function cornerClass(col, totalCols, rotate) {
  if (rotate === 90)  return 'corner-tl'; // right-side player → inner edge = left
  if (rotate === 270) return 'corner-tr'; // left-side player  → inner edge = right
  const isLeft = col <= Math.floor(totalCols / 2);
  if (rotate === 0)   return isLeft ? 'corner-tl' : 'corner-tr'; // bottom tiles
  if (rotate === 180) return isLeft ? 'corner-bl' : 'corner-br'; // top tiles
  return 'corner-tl';
}

// ── Build play grid ────────────────────────────────────────────
function buildGrid(state) {
  const cfg = LAYOUT_CONFIG[state.playerCount];
  const grid = document.getElementById('play-grid');
  grid.style.gridTemplateRows = cfg.rows;
  grid.style.gridTemplateColumns = cfg.cols;
  grid.innerHTML = '';

  const totalCols = cfg.cols.split(' ').length;

  state.slots.slice(0, state.playerCount).forEach((slot, i) => {
    const [row, col, rowSpan, colSpan, rotate] = cfg.slots[i];
    const tile = document.createElement('div');
    const bg = slot.color || '#0a0a0a';
    const fg = slot.color ? textColor(slot.color) : '#f1f5f9';
    tile.className = 'tile' + (slot.eliminated ? ' eliminated' : '') + (!slot.confirmed ? ' tile-editing' : '');
    tile.dataset.slot = i;
    tile.dataset.rotate = rotate;
    tile.style.gridRow = `${row} / span ${rowSpan}`;
    tile.style.gridColumn = `${col} / span ${colSpan}`;
    tile.style.background = bg;
    tile.style.color = fg;

    const swatchesHtml = TILE_COLORS.map(c =>
      `<button class="color-swatch${c === bg ? ' selected' : ''}" data-color="${c}" data-slot="${i}" style="background:${c}" title="${c}"></button>`
    ).join('');

    const crnr = cornerClass(col, totalCols, rotate);

    tile.innerHTML = `
      <div class="tile-inner">
        <div class="tile-content" style="transform:rotate(${rotate}deg)">

          <div class="tile-play-content">
            <div class="tile-hp" data-slot="${i}">${slot.hp}</div>
            <div class="tile-name">${esc(slot.playerName)}</div>
          </div>

          <div class="tile-edit-content">
            <div class="tile-edit-card">
              <select class="tile-sel tile-player-sel" data-slot="${i}">
                ${playerOptions(slot.playerId)}
              </select>
              <select class="tile-sel tile-commander-sel" data-slot="${i}">
                ${commanderOptions(slot.commanderId)}
              </select>
              <div class="tile-swatches" data-slot="${i}">${swatchesHtml}</div>
              <label class="tile-sol-row">
                <input type="checkbox" class="tile-sol-check" data-slot="${i}" ${slot.solRing ? 'checked' : ''}>
                <span>🪙 Sol Ring T1</span>
              </label>
              <button class="tile-ok-btn" data-slot="${i}">OK</button>
            </div>
          </div>

        </div>
        <div class="tile-corner ${crnr}">
          <button class="edit-btn" data-slot="${i}" title="Modifica">✏</button>
        </div>
        <div class="tile-elim-overlay">✕</div>
      </div>`;

    grid.appendChild(tile);
  });
}

function updateTurnDisplay(state) {
  document.getElementById('turn-num').textContent = state.currentTurn;
}

// ── enterPlay ──────────────────────────────────────────────────
function enterPlay(state, runSorteggio = false) {
  const playState = makePlayState(state);
  window._liveState = playState;
  saveState(playState);

  document.getElementById('setup-center').classList.add('hidden');
  document.getElementById('turn-center').style.display = 'flex';

  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen().catch(() => {});

  buildGrid(playState);
  updateTurnDisplay(playState);

  if (runSorteggio) {
    startSorteggio(playState);
  } else {
    bindGridInteractions(playState);
  }
}

// ── Sorteggio animation ────────────────────────────────────────
function startSorteggio(state) {
  const tiles = document.querySelectorAll('.tile');
  const n = state.playerCount;
  const winnerIdx = Math.floor(Math.random() * n);

  const FAST_CYCLES = 3;
  const totalFast = FAST_CYCLES * n;
  const fastEndPos = totalFast % n;
  let slowExtra = (winnerIdx - fastEndPos + n) % n;
  if (slowExtra === 0) slowExtra = n;
  const totalSteps = totalFast + slowExtra;

  let step = 0;
  let prevPos = -1;

  function tick() {
    const pos = step % n;
    if (prevPos >= 0 && prevPos < tiles.length) tiles[prevPos].classList.remove('sorteggio-highlight');
    if (pos < tiles.length) tiles[pos].classList.add('sorteggio-highlight');
    prevPos = pos;
    step++;

    if (step >= totalSteps) {
      setTimeout(() => {
        tiles.forEach(t => t.classList.remove('sorteggio-highlight'));
        state.firstPlayerIndex = winnerIdx;
        saveState(state);
        document.getElementById('play-grid').style.pointerEvents = '';
        bindGridInteractions(state);
      }, 900);
      return;
    }

    const isFast = step < totalFast;
    const delay = isFast ? 80 : 80 + (step - totalFast) * 140;
    setTimeout(tick, delay);
  }

  document.getElementById('play-grid').style.pointerEvents = 'none';
  tick();
}

// ── Play interactions ──────────────────────────────────────────
let longPressTimer = null;
const LONG_PRESS_MS = 500;

function changeHp(state, slotIdx, delta) {
  if (state.slots[slotIdx].eliminated) return;
  state.slots[slotIdx].hp += delta;
  updateTileHp(state, slotIdx);
  checkElimination(state, slotIdx);
  saveState(state);
}

function setHp(state, slotIdx, value) {
  if (state.slots[slotIdx].eliminated) return;
  const parsed = parseInt(value);
  state.slots[slotIdx].hp = isNaN(parsed) ? state.slots[slotIdx].hp : parsed;
  updateTileHp(state, slotIdx);
  checkElimination(state, slotIdx);
  saveState(state);
}

function updateTileHp(state, slotIdx) {
  const hpEl = document.querySelector(`.tile-hp[data-slot="${slotIdx}"]`);
  if (!hpEl) return;
  hpEl.textContent = state.slots[slotIdx].hp;
  hpEl.classList.remove('hp-flash');
  void hpEl.offsetWidth;
  hpEl.classList.add('hp-flash');
}

function checkElimination(state, slotIdx) {
  const slot = state.slots[slotIdx];
  if (!slot.eliminated && slot.hp <= 0) {
    slot.eliminated = true;
    slot.turnEliminated = state.currentTurn;
    saveState(state);
    const tile = document.querySelector(`.tile[data-slot="${slotIdx}"]`);
    if (tile) tile.classList.add('eliminated');
    checkAutoEnd(state);
  }
}

function checkAutoEnd(state) {
  const active = state.slots.filter(s => !s.eliminated);
  if (active.length === 1) {
    const winner = active[0];
    const msg = document.getElementById('end-overlay-msg');
    msg.textContent = `Rimane solo ${winner.playerName}. Terminare la partita?`;
    document.getElementById('end-overlay').classList.add('open');
  }
}

// HP free-input overlay
let hpInputSlot = null;
function openHpInput(state, slotIdx) {
  hpInputSlot = slotIdx;
  document.getElementById('hp-input-field').value = state.slots[slotIdx].hp;
  document.getElementById('hp-input-overlay').classList.add('open');
  document.getElementById('hp-input-field').focus();
  document.getElementById('hp-input-field').select();
}

document.getElementById('hp-input-confirm').addEventListener('click', () => {
  if (hpInputSlot === null) return;
  const val = document.getElementById('hp-input-field').value;
  setHp(window._liveState, hpInputSlot, val);
  document.getElementById('hp-input-overlay').classList.remove('open');
  hpInputSlot = null;
});
document.getElementById('hp-input-cancel').addEventListener('click', () => {
  document.getElementById('hp-input-overlay').classList.remove('open');
  hpInputSlot = null;
});

function bindGridInteractions(state) {
  window._liveState = state;
  if (window._liveInteractionsBound) return;
  window._liveInteractionsBound = true;

  const grid = document.getElementById('play-grid');

  grid.addEventListener('pointerdown', e => {
    const tile = e.target.closest('.tile');
    if (!tile || e.target.closest('button') || e.target.closest('select')) return;
    if (tile.classList.contains('tile-editing')) return;
    const slotIdx = parseInt(tile.dataset.slot);
    longPressTimer = setTimeout(() => {
      longPressTimer = null;
      openHpInput(window._liveState, slotIdx);
    }, LONG_PRESS_MS);
  });

  grid.addEventListener('pointerup', e => {
    if (longPressTimer) {
      clearTimeout(longPressTimer);
      longPressTimer = null;
    } else {
      return;
    }
    const tile = e.target.closest('.tile');
    if (!tile || e.target.closest('button') || e.target.closest('select')) return;
    if (tile.classList.contains('tile-editing')) return;
    const slotIdx = parseInt(tile.dataset.slot);
    if (window._liveState.slots[slotIdx].eliminated) return;
    const rotate = parseInt(tile.dataset.rotate);
    const rect = tile.getBoundingClientRect();
    const cx = e.clientX - rect.left;
    const cy = e.clientY - rect.top;
    let isRight;
    switch (rotate) {
      case 0:   isRight = cx > rect.width / 2;  break;
      case 180: isRight = cx < rect.width / 2;  break;
      case 90:  isRight = cy < rect.height / 2; break;
      case 270: isRight = cy > rect.height / 2; break;
      default:  isRight = cx > rect.width / 2;
    }
    changeHp(window._liveState, slotIdx, isRight ? 1 : -1);
  });

  grid.addEventListener('pointercancel', () => {
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  });

  grid.addEventListener('click', e => {
    const btn = e.target.closest('.sol-btn');
    if (!btn) return;
    const slotIdx = parseInt(btn.dataset.slot);
    window._liveState.slots[slotIdx].solRing = !window._liveState.slots[slotIdx].solRing;
    btn.classList.toggle('sol-active', window._liveState.slots[slotIdx].solRing);
    saveState(window._liveState);
  });

  grid.addEventListener('click', e => {
    const btn = e.target.closest('.edit-btn');
    if (!btn) return;
    setTileEditMode(window._liveState, parseInt(btn.dataset.slot));
  });

  grid.addEventListener('click', e => {
    const btn = e.target.closest('.tile-ok-btn');
    if (!btn) return;
    handleTileOk(window._liveState, parseInt(btn.dataset.slot));
  });

  grid.addEventListener('click', e => {
    const swatch = e.target.closest('.color-swatch');
    if (!swatch) return;
    const slotIdx = parseInt(swatch.dataset.slot);
    const color = swatch.dataset.color;
    window._liveState.slots[slotIdx].color = color;
    const tile = document.querySelector(`.tile[data-slot="${slotIdx}"]`);
    const fg = textColor(color);
    tile.style.background = color;
    tile.style.color = fg;
    tile.querySelectorAll('.color-swatch').forEach(s => {
      s.classList.toggle('selected', s.dataset.color === color);
    });
    saveState(window._liveState);
  });
}

// ── Turn counter ───────────────────────────────────────────────
let turnLongPressTimer = null;
let endGameVisible = false;
let turnLongPressed = false;

document.getElementById('setup-back-btn').addEventListener('click', () => {
  clearState();
  window.location.href = '/';
});

document.getElementById('home-btn').addEventListener('click', () => {
  const exit = document.fullscreenElement
    ? document.exitFullscreen()
    : Promise.resolve();
  exit.catch(() => {}).finally(() => { window.location.href = '/'; });
});

document.getElementById('turn-minus').addEventListener('click', () => {
  const state = window._liveState;
  if (!state) return;
  state.currentTurn = Math.max(1, state.currentTurn - 1);
  updateTurnDisplay(state);
  saveState(state);
});

document.getElementById('turn-plus').addEventListener('click', () => {
  const state = window._liveState;
  if (!state) return;
  state.currentTurn++;
  updateTurnDisplay(state);
  saveState(state);
});

document.getElementById('turn-num').addEventListener('click', function() {
  if (turnLongPressed) { turnLongPressed = false; return; }
  this.contentEditable = 'true';
  this.focus();
  const range = document.createRange();
  range.selectNodeContents(this);
  window.getSelection().removeAllRanges();
  window.getSelection().addRange(range);
});

document.getElementById('turn-num').addEventListener('blur', function() {
  const state = window._liveState;
  if (!state) return;
  const val = parseInt(this.textContent);
  state.currentTurn = isNaN(val) || val < 1 ? 1 : val;
  this.contentEditable = 'false';
  updateTurnDisplay(state);
  saveState(state);
});

document.getElementById('turn-num').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') { e.preventDefault(); this.blur(); }
});

document.getElementById('turn-num').addEventListener('pointerdown', () => {
  turnLongPressTimer = setTimeout(() => {
    turnLongPressed = true;
    endGameVisible = !endGameVisible;
    document.getElementById('long-press-actions').classList.toggle('visible', endGameVisible);
  }, LONG_PRESS_MS);
});

document.getElementById('turn-num').addEventListener('pointerup', () => {
  if (turnLongPressTimer) { clearTimeout(turnLongPressTimer); turnLongPressTimer = null; }
});

// ── End game ───────────────────────────────────────────────────
function endGame(state) {
  const slots = state.slots;
  const winnerIdx = slots.findIndex(s => !s.eliminated);

  const rows = slots.map((slot, i) => ({
    player_id:      slot.playerId,
    commander_id:   slot.commanderId,
    is_winner:      i === winnerIdx,
    sol_ring:       slot.solRing,
    turn_eliminated: slot.turnEliminated,
    turn_order:     i + 1,
  }));

  const prefill = {
    date: state.startedAt,
    total_turns: state.currentTurn,
    rows,
  };

  sessionStorage.setItem('mtg_prefill', JSON.stringify(prefill));
  clearState();

  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  document.body.classList.remove('live-play');

  window.location.href = '/game/new';
}

document.getElementById('end-game-btn').addEventListener('click', () => {
  if (!window._liveState) return;
  endGame(window._liveState);
});

document.getElementById('end-overlay-confirm').addEventListener('click', () => {
  document.getElementById('end-overlay').classList.remove('open');
  endGame(window._liveState);
});
document.getElementById('end-overlay-ignore').addEventListener('click', () => {
  document.getElementById('end-overlay').classList.remove('open');
});
</script>
