{% extends "base.html" %}
{% block title %}{{ 'Modifica' if game else 'Nuova' }} Partita{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
  <h1 class="text-xl font-bold text-white mb-6">
    {{ '✏️ Modifica Partita' if game else '➕ Nuova Partita' }}
  </h1>

  <form id="gameForm" method="POST"
        action="{{ url_for('main.game_edit', game_id=game.id) if game else url_for('main.game_new') }}">

    <input type="hidden" name="num_players" id="numPlayersInput" value="0">
    <input type="hidden" name="total_turns" id="totalTurnsInput" value="">

    <!-- Date -->
    <div class="card p-4 mb-4">
      <div style="width:11rem">
        <label>Data</label>
        <input type="date" name="date" required
               value="{{ game.date.isoformat() if game else today }}">
      </div>
    </div>

    <!-- Player rows -->
    <div class="card p-5 mb-4">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-sm font-semibold text-slate-300">Giocatori</h2>
        <button type="button" id="addRowBtn" class="btn-sm">+ Giocatore</button>
      </div>
      <!-- Column headers (desktop) -->
      <div class="hidden md:flex items-center gap-2 mb-1 px-1 text-xs text-slate-500"
           style="padding-left:0.25rem">
        <span style="width:1.25rem"></span>
        <span style="width:1.1rem" title="Vincitore">🏆</span>
        <span class="flex-1">Giocatore</span>
        <span class="flex-1">Commander</span>
        <span style="width:3rem" title="Sol Ring T1">🪙</span>
        <span style="width:5.5rem">Turno elim.</span>
        <span style="width:1.75rem"></span>
        <span style="width:1.75rem"></span>
      </div>
      <div id="playerRows" style="overflow-x:auto"></div>
    </div>

    <div class="flex gap-3 justify-end">
      <a href="{{ url_for('main.history') }}" class="btn-sm">Annulla</a>
      <button type="submit" class="btn-primary">
        {{ 'Salva Modifiche' if game else 'Salva Partita' }}
      </button>
    </div>
  </form>
</div>

<script>
const PLAYERS    = {{ players_json | tojson }};
const COMMANDERS = {{ commanders_json | tojson }};
const WIN_CONDS  = {{ win_conditions | tojson }};
const LOSS_CONDS = {{ loss_conditions | tojson }};
const INIT_DATA  = {{ existing_entries_json | tojson }};
const MIN_ROWS = 2, MAX_ROWS = 6;

let rowCount = 0;

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function optObj(arr, valKey, labelFn, sel) {
  return arr.map(item => {
    const v = item[valKey];
    const s = (sel != null && String(sel) === String(v)) ? ' selected' : '';
    return `<option value="${v}"${s}>${esc(labelFn(item))}</option>`;
  }).join('');
}

function optStr(arr, sel) {
  return arr.map(v => {
    const s = (sel === v) ? ' selected' : '';
    return `<option value="${esc(v)}"${s}>${esc(v)}</option>`;
  }).join('');
}

function buildRow(idx, d) {
  d = d || {};
  const iw = !!d.is_winner;
  const el = document.createElement('div');
  el.className = 'player-row';
  el.dataset.idx = idx;
  el.innerHTML = `
<div class="flex items-center gap-2 py-1.5" style="min-width:36rem">
  <span class="slot-num text-xs text-slate-500 shrink-0 text-center" style="width:1.25rem">${idx+1}</span>
  <input type="radio" name="winner_slot" value="${idx}"
         class="winner-radio shrink-0 accent-amber-400 cursor-pointer"
         style="width:1.1rem;height:1.1rem" ${iw?'checked':''} title="Segna come vincitore">
  <select name="p${idx}_player" required class="flex-1" style="min-width:0">
    <option value="">— Giocatore —</option>
    ${optObj(PLAYERS,'id',p=>p.name,d.player_id)}
  </select>
  <select name="p${idx}_commander" required class="flex-1" style="min-width:0">
    <option value="">— Commander —</option>
    ${optObj(COMMANDERS,'id',c=>c.name+' ('+c.color_identity+')',d.commander_id)}
  </select>
  <div class="shrink-0 flex justify-center" style="width:3rem" title="Sol Ring T1">
    <input type="checkbox" name="p${idx}_sol_ring"
           class="accent-amber-400 cursor-pointer" style="width:1rem;height:1rem"
           ${d.sol_ring?'checked':''}>
  </div>
  <div class="turn-elim shrink-0" style="width:5.5rem;${iw?'visibility:hidden':''}">
    <input type="number" name="p${idx}_turn_eliminated" min="1" max="99"
           value="${d.turn_eliminated||''}" placeholder="turno" class="text-center">
  </div>
  <button type="button" class="details-btn btn-sm shrink-0 px-1.5" style="min-width:1.75rem" title="Dettagli">▾</button>
  <button type="button" class="remove-btn btn-danger shrink-0 px-1.5" style="min-width:1.75rem" title="Rimuovi">✕</button>
</div>
<div class="details-panel hidden mt-1 mb-2 grid grid-cols-2 md:grid-cols-4 gap-3 p-3 rounded-lg"
     style="margin-left:2.5rem;background:#0f1117;border:1px solid #2d3147">
  <div class="loser-only ${iw?'hidden':''}">
    <label>Eliminato Da</label>
    <select name="p${idx}_eliminated_by">
      <option value="">—</option>
      ${optObj(COMMANDERS,'id',c=>c.name,d.eliminated_by_id)}
    </select>
  </div>
  <div class="winner-only ${iw?'':'hidden'}">
    <label>Win Condition</label>
    <select name="p${idx}_victory_condition">
      <option value="">—</option>
      ${optStr(WIN_CONDS,d.victory_condition)}
    </select>
  </div>
  <div class="loser-only ${iw?'hidden':''}">
    <label>Loss Condition</label>
    <select name="p${idx}_loss_condition">
      <option value="">—</option>
      ${optStr(LOSS_CONDS,d.loss_condition)}
    </select>
  </div>
  <div>
    <label>Note</label>
    <input type="text" name="p${idx}_notes" value="${esc(d.notes||'')}" placeholder="Note...">
  </div>
</div>`;

  el.querySelector('.winner-radio').addEventListener('change', syncWinnerUI);
  el.querySelector('.details-btn').addEventListener('click', function() {
    const panel = el.querySelector('.details-panel');
    panel.classList.toggle('hidden');
    this.textContent = panel.classList.contains('hidden') ? '▾' : '▴';
  });
  el.querySelector('.remove-btn').addEventListener('click', function() {
    if (rowCount > MIN_ROWS) {
      el.remove();
      rowCount--;
      renumber();
      updateUI();
    }
  });
  return el;
}

function addRow(d) {
  if (rowCount >= MAX_ROWS) return;
  document.getElementById('playerRows').appendChild(buildRow(rowCount++, d));
  updateUI();
}

function renumber() {
  document.querySelectorAll('.player-row').forEach((row, idx) => {
    row.dataset.idx = idx;
    row.querySelector('.slot-num').textContent = idx + 1;
    row.querySelector('.winner-radio').value = idx;
    row.querySelectorAll('[name]').forEach(el => {
      el.name = el.name.replace(/^p\d+_/, 'p' + idx + '_');
    });
  });
}

function syncWinnerUI() {
  document.querySelectorAll('.player-row').forEach(row => {
    const iw = row.querySelector('.winner-radio').checked;
    row.querySelector('.turn-elim').style.visibility = iw ? 'hidden' : '';
    row.querySelectorAll('.loser-only').forEach(e => e.classList.toggle('hidden', iw));
    row.querySelectorAll('.winner-only').forEach(e => e.classList.toggle('hidden', !iw));
  });
}

function updateUI() {
  const rows = document.querySelectorAll('.player-row');
  const n = rows.length;
  rows.forEach(r => r.querySelector('.remove-btn').style.visibility = n > MIN_ROWS ? '' : 'hidden');
  document.getElementById('addRowBtn').style.display = n >= MAX_ROWS ? 'none' : '';
  document.getElementById('numPlayersInput').value = n;
}

document.getElementById('addRowBtn').addEventListener('click', () => addRow());

const prefill = (() => {
  try {
    const raw = sessionStorage.getItem('mtg_prefill');
    if (!raw) return null;
    sessionStorage.removeItem('mtg_prefill');
    return JSON.parse(raw);
  } catch { return null; }
})();

if (prefill) {
  const dateInput = document.querySelector('[name="date"]');
  if (dateInput && prefill.date) dateInput.value = prefill.date;
  prefill.rows.forEach(r => addRow({
    player_id:       r.player_id,
    commander_id:    r.commander_id,
    is_winner:       r.is_winner,
    sol_ring:        r.sol_ring,
    turn_eliminated: r.turn_eliminated,
  }));
  syncWinnerUI();
  if (prefill.total_turns) document.getElementById('totalTurnsInput').value = prefill.total_turns;
} else if (INIT_DATA.length) {
  INIT_DATA.forEach(d => addRow(d));
} else {
  for (let i = 0; i < 4; i++) addRow();
}
</script>
{% endblock %}
